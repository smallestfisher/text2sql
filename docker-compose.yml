services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: text2sql-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: admin
      APP_USER_PASSWORD: admin123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/oracle_business_init.sh:/container-entrypoint-initdb.d/01-business-schema.sh:ro
      - ./sql/oracle_business_schema.sql:/opt/text2sql/sql/oracle_business_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: text2sql-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysqlroot123
      MYSQL_DATABASE: manager
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/mysql_runtime_init.sql:/docker-entrypoint-initdb.d/01-runtime-init.sql:ro
      - ./sql/runtime_store.sql:/opt/text2sql/sql/runtime_store.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  oracle-data:
  mysql-data:
