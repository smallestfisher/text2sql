services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: text2sql-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      BUSINESS_DATABASE_URL: ${DOCKER_BUSINESS_DATABASE_URL:-oracle+oracledb://admin:admin123@oracle:1521/?service_name=FREEPDB1}
      RUNTIME_DATABASE_URL: ${DOCKER_RUNTIME_DATABASE_URL:-mysql+pymysql://admin:admin123@mysql:3306/manager}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      ENABLE_VECTOR_RETRIEVAL: ${ENABLE_VECTOR_RETRIEVAL:-true}
      PREWARM_VECTOR_RETRIEVAL: ${PREWARM_VECTOR_RETRIEVAL:-true}
      VECTOR_RETRIEVAL_PROVIDER: ${VECTOR_RETRIEVAL_PROVIDER:-siliconflow}
      VECTOR_API_KEY: ${VECTOR_API_KEY:-${OPENAI_API_KEY:-}}
      VECTOR_API_BASE: ${VECTOR_API_BASE:-https://api.siliconflow.cn/v1}
      VECTOR_MODEL: ${VECTOR_MODEL:-Qwen/Qwen3-Embedding-8B}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-8}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-token-secret-change-me}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    volumes:
      - ./semantic:/app/semantic
      - ./examples:/app/examples
      - ./eval:/app/eval
      - ./schemas:/app/schemas:ro
      - ./sql/runtime_store.sql:/app/sql/runtime_store.sql:ro
    depends_on:
      oracle:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: text2sql-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  oracle:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/gvenzl/oracle-free:23
    container_name: text2sql-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: admin
      APP_USER_PASSWORD: admin123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/oracle_business_init.sh:/container-entrypoint-initdb.d/01-business-schema.sh:ro
      - ./sql/oracle_business_schema.sql:/opt/text2sql/sql/oracle_business_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.4.0
    container_name: text2sql-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysqlroot123
      MYSQL_DATABASE: manager
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/mysql_runtime_init.sql:/docker-entrypoint-initdb.d/01-runtime-init.sql:ro
      - ./sql/runtime_store.sql:/opt/text2sql/sql/runtime_store.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  oracle-data:
  mysql-data:
