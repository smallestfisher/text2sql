services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: text2sql-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Text2SQL Backend}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      APP_ENV: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BUSINESS_DATABASE_URL: ${DOCKER_BUSINESS_DATABASE_URL:-oracle+oracledb://admin:admin123@oracle:1521/?service_name=FREEPDB1}
      BUSINESS_DATABASE_SCHEMAS: ${DOCKER_BUSINESS_DATABASE_SCHEMAS:-${BUSINESS_DATABASE_SCHEMAS:-}}
      RUNTIME_DATABASE_URL: ${DOCKER_RUNTIME_DATABASE_URL:-sqlite:////app/data/runtime.db}
      VECTOR_CACHE_DIR: ${DOCKER_VECTOR_CACHE_DIR:-/app/data/vector-cache}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SQL_REPAIR_MAX_RETRIES: ${SQL_REPAIR_MAX_RETRIES:-1}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
      LLM_CACHE_MAX_ENTRIES: ${LLM_CACHE_MAX_ENTRIES:-256}
      LLM_CACHE_PROMPT: ${LLM_CACHE_PROMPT:-}
      ENABLE_VECTOR_RETRIEVAL: ${ENABLE_VECTOR_RETRIEVAL:-true}
      PREWARM_VECTOR_RETRIEVAL: ${PREWARM_VECTOR_RETRIEVAL:-true}
      VECTOR_RETRIEVAL_PROVIDER: ${VECTOR_RETRIEVAL_PROVIDER:-siliconflow}
      VECTOR_API_KEY: ${VECTOR_API_KEY:-${OPENAI_API_KEY:-}}
      VECTOR_API_BASE: ${VECTOR_API_BASE:-https://api.siliconflow.cn/v1}
      VECTOR_MODEL: ${VECTOR_MODEL:-Qwen/Qwen3-Embedding-8B}
      VECTOR_DIMENSIONS: ${VECTOR_DIMENSIONS:-1024}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-8}
      VECTOR_TIMEOUT_SECONDS: ${VECTOR_TIMEOUT_SECONDS:-20}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-30}
      DEFAULT_SQL_LIMIT: ${DEFAULT_SQL_LIMIT:-200}
      HIGH_RISK_SQL_LIMIT: ${HIGH_RISK_SQL_LIMIT:-1000}
      EXECUTION_CACHE_TTL_SECONDS: ${EXECUTION_CACHE_TTL_SECONDS:-30}
      EXECUTION_CACHE_MAX_ENTRIES: ${EXECUTION_CACHE_MAX_ENTRIES:-256}
      EXECUTION_MAX_ROWS: ${EXECUTION_MAX_ROWS:-500}
      SLOW_QUERY_THRESHOLD_MS: ${SLOW_QUERY_THRESHOLD_MS:-3000}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-token-secret-change-me}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    volumes:
      - ./sql/runtime_store.sql:/app/sql/runtime_store.sql:ro
      - runtime-data:/app/data
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: text2sql-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  oracle:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/gvenzl/oracle-free:23
    container_name: text2sql-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: admin
      APP_USER_PASSWORD: admin123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  oracle-data:
  runtime-data:
